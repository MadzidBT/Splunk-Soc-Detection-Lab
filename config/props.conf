# ---------------------------------------------------------------------------
# props.conf for the SOC detection lab
#
# Create props.conf and transforms.conf files in $SPLUNK_HOME/etc/apps/soc_lab/local/
# Then restart Splunk (/opt/splunk/bin/splunk restart)
# Do this BEFORE uploading the data files.
#
# access_combined needs no custom stanza (built-in sourcetype).
# ---------------------------------------------------------------------------

[firewall_csv]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
SHOULD_LINEMERGE = false
category = Custom
description = Lab firewall log (CSV with header)

[winsec_csv]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
SHOULD_LINEMERGE = false
category = Custom
description = Lab Windows Security events exported as CSV

[dns_tsv]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRANSFORMS-drop_header = dns_tsv_drop_header
REPORT-dns_tsv_fields = dns_tsv_fields
category = Custom
description = Lab DNS log, Zeek-style tab-separated, epoch timestamp

[linux_secure]
# The generated secure.log uses ISO 8601 timestamps with a timezone, so Splunk can auto-detect the time. 
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 40
